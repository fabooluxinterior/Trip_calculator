<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Trip Calculator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <label class="visually-hidden" for="tripName">Trip name</label>
        <input id="tripName" class="trip-name" type="text" maxlength="40" value="My Trip" autocomplete="off" spellcheck="false">
      </div>
      <div class="sync">
        <span class="live-badge" id="liveBadge" hidden></span>
        <button class="btn btn-small" id="authBtn" type="button" hidden>Sign in to edit</button>
      </div>
    </header>

    <main>
      <section class="summary" aria-label="Summary">
        <article class="stat">
          <span class="stat-label">Total Collected</span>
          <strong class="stat-value" id="statCollected">₹0</strong>
        </article>
        <article class="stat">
          <span class="stat-label">Total Expenses</span>
          <strong class="stat-value" id="statSpent">₹0</strong>
        </article>
        <article class="stat stat-primary">
          <span class="stat-label">Remaining Balance</span>
          <strong class="stat-value" id="statRemaining">₹0</strong>
          <span class="stat-note" id="statNote"></span>
        </article>
      </section>

      <div class="meter" role="progressbar" aria-label="Share of collected money spent" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="meter">
        <div class="meter-fill" id="meterFill"></div>
      </div>

      <div class="tabs" role="tablist" aria-label="View">
        <button class="tab" role="tab" id="tabMembers" aria-controls="membersCard" aria-selected="true" data-view="members">Members</button>
        <button class="tab" role="tab" id="tabExpenses" aria-controls="expensesCard" aria-selected="false" data-view="expenses">Expenses</button>
      </div>

      <div class="columns" id="columns" data-view="members">
        <section class="card" id="membersCard" role="tabpanel" aria-labelledby="tabMembers">
          <div class="card-head">
            <h2>Members <span class="count" id="memberCount">0</span></h2>
            <button class="btn btn-primary" id="addMemberBtn" type="button">
              <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>
              Add Member
            </button>
          </div>
          <ul class="list" id="memberList"></ul>
        </section>

        <section class="card" id="expensesCard" role="tabpanel" aria-labelledby="tabExpenses">
          <div class="card-head">
            <h2>Expenses <span class="count" id="expenseCount">0</span></h2>
            <button class="btn btn-primary" id="addExpenseBtn" type="button">
              <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>
              Add Expense
            </button>
          </div>
          <ul class="list" id="expenseList"></ul>
        </section>
      </div>
    </main>
  </div>

  <dialog id="memberDialog" class="dialog" aria-labelledby="memberDialogTitle">
    <form id="memberForm" class="dialog-body" novalidate>
      <h3 id="memberDialogTitle">Add Member</h3>
      <label class="field">
        <span>Name</span>
        <input id="memberName" name="name" type="text" maxlength="40" required autocomplete="off" placeholder="e.g. Anil">
      </label>
      <label class="field">
        <span>Amount collected (₹)</span>
        <input id="memberAmount" name="amount" type="number" inputmode="decimal" min="0" step="0.01" required placeholder="0">
      </label>
      <p class="form-error" id="memberError" role="alert" hidden></p>
      <div class="dialog-actions">
        <button class="btn" type="button" data-close>Cancel</button>
        <button class="btn btn-primary" type="submit" id="memberSubmit">Add</button>
      </div>
    </form>
  </dialog>

  <dialog id="expenseDialog" class="dialog" aria-labelledby="expenseDialogTitle">
    <form id="expenseForm" class="dialog-body" novalidate>
      <h3 id="expenseDialogTitle">Add Expense</h3>
      <label class="field">
        <span>Description</span>
        <input id="expenseTitle" name="title" type="text" maxlength="60" required autocomplete="off" placeholder="e.g. Fuel">
      </label>
      <div class="field-row">
        <label class="field">
          <span>Amount (₹)</span>
          <input id="expenseAmount" name="amount" type="number" inputmode="decimal" min="0" step="0.01" required placeholder="0">
        </label>
        <label class="field">
          <span>Date</span>
          <input id="expenseDate" name="date" type="date" required>
        </label>
      </div>
      <p class="form-error" id="expenseError" role="alert" hidden></p>
      <div class="dialog-actions">
        <button class="btn" type="button" data-close>Cancel</button>
        <button class="btn btn-primary" type="submit" id="expenseSubmit">Add</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden>
    <span id="toastText"></span>
    <button type="button" id="toastUndo">Undo</button>
  </div>

  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
